# 复制为根目录 config.yaml。真实配置被 Git 忽略，仅由本地 Python 后端读取。
# 已有 config.yaml 只写 apikey 也可运行，其余采用以下默认值。
apikey: "YOUR_VOLCENGINE_ARK_API_KEY"

app:
  port: 8000
  database_path: "./data/yuanxi.db"

llm:
  provider: "volcengine-ark"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  # 官方模型 ID；也可填写已开通的 ep-... 推理接入点 ID。
  model: "doubao-seed-2-0-pro-260215"
  thinking: "disabled"
  temperature: 0.4
  max_tokens: 2500
  timeout_seconds: 90

# POST /chat/completions；Authorization: Bearer <apikey>
# JSON 结构化结果 + SSE 流式文字。文档：
# https://www.volcengine.com/docs/82379/1494384
