# 复制为 config.yaml，填写你使用的服务商信息。真实配置已被 Git 忽略。
# 不限公司，但必须支持 Chat Completions、工具调用、JSON 输出和 SSE 流式响应。
apikey: "YOUR_API_KEY"

app:
  port: 8000
  database_path: "./data/yuanxi.db"

llm:
  provider: "openai-compatible"
  # 服务商 API 根地址，保留版本路径；不要包含 /chat/completions。
  base_url: "https://your-provider.example/v1"
  model: "YOUR_MODEL_ID"
  temperature: 0.4
  max_tokens: 2500
  timeout_seconds: 90

# 后端请求：POST <base_url>/chat/completions
# 鉴权方式：Authorization: Bearer <apikey>
# 使用火山方舟时也可填写其地址和模型；若需要专属 thinking 参数，
# 将 provider 改为 volcengine-ark，并在 llm 中添加 thinking: disabled。
